[package]
name = "avenlab-physics"
version = "0.1.0"
edition = "2024"
description = "Vehicle dynamics and wheel-load telemetry for Rapier simulations"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Avensky/avenlab-physics"
include = ["/src", "/examples", "/README.md", "/LICENSE*"]
publish = ["crates-io"]

[dependencies]
rapier3d = { version = "0.22", features = ["dim3"] }
